---
name: CI-Windows
permissions: {}

on:
  workflow_call:
    inputs:
      publish_release:
        required: true
        type: string
      release_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string

jobs:
  build_windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: msys2 {0}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-AMD64
            os: windows-2022
            arch: x86_64
            msystem: ucrt64
            toolchain: ucrt-x86_64
          - name: Windows-ARM64
            os: windows-11-arm
            arch: aarch64
            msystem: clangarm64
            toolchain: clang-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: true
          install: >-
            git
            mingw-w64-${{ matrix.toolchain }}-boost
            mingw-w64-${{ matrix.toolchain }}-cmake
            mingw-w64-${{ matrix.toolchain }}-cppwinrt
            mingw-w64-${{ matrix.toolchain }}-curl-winssl
            mingw-w64-${{ matrix.toolchain }}-gcc
            mingw-w64-${{ matrix.toolchain }}-miniupnpc
            mingw-w64-${{ matrix.toolchain }}-nlohmann-json
            mingw-w64-${{ matrix.toolchain }}-onevpl
            mingw-w64-${{ matrix.toolchain }}-openssl
            mingw-w64-${{ matrix.toolchain }}-opus
            mingw-w64-${{ matrix.toolchain }}-toolchain
            ${{ matrix.msystem == 'ucrt64' && format('mingw-w64-{0}-MinHook', matrix.toolchain) || '' }}

      - name: Setup NodeJS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 'lts/*'

      - name: NodeJS Path
        id: nodejs
        shell: pwsh
        run: |
          $NODEJS_PATH = Split-Path -Path (Get-Command node).Source -Parent
          echo "NODEJS_PATH=$NODEJS_PATH" >> $env:GITHUB_ENV

      - name: Build
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ inputs.release_version }}
          COMMIT: ${{ inputs.release_commit }}
        run: |
          NODEJS_PATH=$(cygpath "$NODEJS_PATH")
          export PATH="$PATH:$NODEJS_PATH"

          mkdir -p build
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DBUILD_TESTS=OFF \
            -DBUILD_DOCS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_ENABLE_TRAY=OFF
          ninja -C build

      - name: Collect artifacts
        shell: pwsh
        run: |
          mkdir artifacts

          # Main binary
          Copy-Item build/RuntimeBroker.exe artifacts/

          # Service wrapper and tools
          Copy-Item build/tools/*.exe artifacts/ -ErrorAction SilentlyContinue

          # Assets directory (web UI, shaders, app config)
          Copy-Item -Recurse build/assets artifacts/assets

          # DLLs built by the project (zlib, minhook-detours, etc.)
          Copy-Item build/*.dll artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem -Path build/_deps -Recurse -Filter *.dll | Copy-Item -Destination artifacts/ -ErrorAction SilentlyContinue

      - name: Collect MSYS2 runtime DLLs
        run: |
          set +e
          msys_bin="/${{ matrix.msystem }}/bin"
          for exe in artifacts/*.exe; do
            [ -f "$exe" ] || continue
            ldd "$exe" 2>/dev/null | while IFS= read -r line; do
              dll=$(echo "$line" | grep -o "/${{ matrix.msystem }}/[^ ]*")
              if [ -n "$dll" ] && [ -f "$dll" ]; then
                cp "$dll" artifacts/ 2>/dev/null
              fi
            done
          done
          echo "=== Collected DLLs ==="
          ls artifacts/*.dll 2>/dev/null || echo "No DLLs found"
          exit 0

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: RuntimeBroker-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error
